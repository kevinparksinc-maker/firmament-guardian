name: One-time live Horary smoke
on:
  push:
    paths:
      - .github/workflows/horary-live-smoke.yml
  workflow_dispatch:
jobs:
  horary-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Request a sample Horary judgment from production
        env:
          BASE_URL: https://the-absolute.onrender.com
        run: |
          python - <<'PY'
          import datetime, json, os, sys, time, urllib.error, urllib.request
          from zoneinfo import ZoneInfo

          base = os.environ["BASE_URL"]
          def call(path, payload=None, timeout=30):
              headers = {"Accept": "application/json", "User-Agent": "TheAbsolute-ReleaseSmoke/1"}
              body = None
              if payload is not None:
                  body = json.dumps({"json": payload}).encode("utf-8")
                  headers["Content-Type"] = "application/json"
                  headers["Origin"] = base
              request = urllib.request.Request(base+path, data=body, headers=headers, method="POST" if body else "GET")
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      raw = response.read(4_000_000)
                      return response.status, raw, round(time.monotonic()-started, 2)
              except urllib.error.HTTPError as error:
                  return error.code, error.read(100_000), round(time.monotonic()-started, 2)

          for path in ("/health", "/ready"):
              try:
                  status, raw, elapsed = call(path)
                  print(f"{path}: HTTP {status}, {elapsed}s")
                  if path == "/ready":
                      data = json.loads(raw)
                      checks = data.get("checks", {})
                      print("readiness:", {"ready": data.get("ready"),
                        "sessionSigning": checks.get("sessionSigning"),
                        "databaseConfigured": checks.get("databaseConfigured"),
                        "interpreterProviders": checks.get("interpreterProviders")})
              except Exception as e:
                  print(f"{path}: transport exception {type(e).__name__}")
          moment = datetime.datetime.now(ZoneInfo("America/Los_Angeles"))
          input_data = {
              "question": "Will the current release candidate meet the requirements for a limited private beta?",
              "location": "Las Vegas, Nevada, United States",
              "latitude": 36.1699,
              "longitude": -115.1398,
              "timezone": "America/Los_Angeles",
              "date": moment.strftime("%Y-%m-%d"),
              "time": moment.strftime("%H:%M"),
              "subject": "querent",
              "topicHouse": 10
          }
          print("Horary input: sample private-beta question; Las Vegas local time",input_data["date"],input_data["time"])
          try:
              status, raw, elapsed = call("/api/trpc/horary.open", input_data, timeout=150)
              print(f"horary.open: HTTP {status}, {elapsed}s, response_bytes={len(raw)}")
              response = json.loads(raw)
              if "error" in response:
                  err=response["error"]
                  data=err.get("data",{}) if isinstance(err,dict) else {}
                  print("TRPC error:", {"code":data.get("code"),"httpStatus":data.get("httpStatus"),
                    "message":str(err.get("message",""))[:350]})
                  sys.exit(1)
              result=response.get("result",{}).get("data",{})
              if isinstance(result,dict) and "json" in result:
                  result=result["json"]
              if not isinstance(result,dict):
                  print("Unexpected result type:", type(result).__name__)
                  sys.exit(1)
              print("result keys:", list(result.keys())[:30])
              lengths={key:len(value) for key,value in result.items() if isinstance(value,str)}
              print("text field lengths:", lengths)
              def find_text(obj,depth=0):
                  if depth>4:return []
                  if isinstance(obj,str):return [len(obj)]
                  if isinstance(obj,dict):return sum((find_text(v,depth+1) for v in obj.values()),[])
                  if isinstance(obj,list):return sum((find_text(v,depth+1) for v in obj[:15]),[])
                  return []
              texts=find_text(result)
              print("text-node lengths (top 20):",sorted(texts,reverse=True)[:20])
              reading = result.get("reading")
              synthesis_status = result.get("synthesisStatus")
              print("synthesisStatus:", synthesis_status)
              print("reading type:", type(reading).__name__, "reading length:", len(reading) if isinstance(reading,str) else 0)
              headings = ("## The Answer", "## What Is Happening", "## What Happens Next", "## What This Means for You")
              if synthesis_status != "ai_completed" or not isinstance(reading, str) or len(reading.strip()) < 200 or not all(h in reading for h in headings):
                  print("FAILED: calculated chart returned but AI judgment is absent or incomplete")
                  sys.exit(1)
              print("PASS: complete four-section Horary judgment returned from live endpoint")
          except Exception as error:
              print("horary.open transport/parser exception:",type(error).__name__,str(error)[:250])
              sys.exit(1)
          PY
