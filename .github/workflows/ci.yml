name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repository currently has no pnpm-lock.yaml. Allow dependency resolution
      # until a generated lockfile is committed; then restore --frozen-lockfile.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - run: docker build --tag firmament-guardian-ci .
