name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile # repository does not yet commit pnpm-lock.yaml
      - name: Export generated dependency lock for audit remediation
        if: github.head_ref == 'firmament/post-audit-upgrades-2026-10-14'
        run: |
          echo FIRMAMENT_LOCKFILE_BEGIN
          base64 -w 120 pnpm-lock.yaml
          echo FIRMAMENT_LOCKFILE_END
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
