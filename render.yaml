# Render Blueprint: server hosts both the built React app and tRPC API.
# Configure secrets in the Render dashboard; never commit actual key values.
services:
  - type: web
    name: the-absolute
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Primary interpreter and automatic downstream fallbacks.
      # Secrets must be populated on Render: the blueprint cannot supply them.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_URL
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
